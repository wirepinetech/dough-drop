<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dough Drop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --shop-pink: #ff6b9e;
            --shop-yellow: #fcd34d;
            --shop-white: #ffffff;
            --shop-cream: #fff9f0;
            --text-dark: #4a2c2a;
            --purple: #5B2D8E;
            --purple-mid: #7B45B8;
        }

        /* Low-poly background canvas */
        #poly-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', 'Comic Sans MS', "Chalkboard SE", sans-serif;
            background-color: var(--shop-pink);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.2) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header { 
            padding: 2rem 1rem 1rem; 
            text-align: center; 
            position: relative; 
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .app-icon {
            width: 85px;
            height: 85px;
            border-radius: 22px;
            border: 4px solid var(--purple);
            box-shadow: 4px 4px 0 var(--purple);
            object-fit: cover;
        }

        h1 { 
            font-family: 'Boogaloo', 'Comic Sans MS', cursive;
            font-size: 2.8rem; margin: 0; color: white; 
            text-shadow: 3px 3px 0px var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        #builder { 
            width: 95%; max-width: 500px; padding: 1.5rem; 
            background: var(--shop-cream); 
            border-radius: 30px; 
            box-shadow: 0 15px 0px rgba(0,0,0,0.1);
            margin-bottom: 4rem;
            border: 4px solid var(--text-dark);
            transition: opacity 0.4s ease, transform 0.4s ease;
            position: relative;
            z-index: 5;
        }

        .section-label {
            font-family: 'Boogaloo', cursive;
            font-size: 1.05rem; text-transform: uppercase; color: var(--text-dark);
            margin: 1.5rem 0 0.75rem; font-weight: 400; letter-spacing: 2px;
        }

        .visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .visual-card {
            background: white; border: 3px solid #e2e8f0; border-radius: 20px;
            padding: 15px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .visual-card.active {
            background: var(--shop-pink);
            border-color: var(--text-dark);
            color: white;
            box-shadow: 3px 3px 0 var(--text-dark);
            transform: translate(-2px, -2px);
        }

        /* Frosting: circular colour swatches */
        .glaze-row { display: flex; justify-content: center; gap: 18px; }
        .glaze-drip-ui {
            width: 60px; height: 60px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid var(--text-dark);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 3px 3px 0 var(--text-dark);
            position: relative;
            transition: transform 0.15s, box-shadow 0.15s;
            flex-shrink: 0;
        }
        .glaze-drip-ui::after {
            content: '';
            position: absolute; inset: -6px;
            border-radius: 50%;
            border: 3px solid transparent;
            transition: border-color 0.15s;
        }
        .glaze-drip-ui.active {
            transform: translate(-2px, -2px) scale(1.1);
            box-shadow: 5px 5px 0 var(--text-dark);
            border-width: 4px;
        }
        .glaze-drip-ui.active::after { border-color: var(--text-dark); }
        .glaze-drip-ui:hover:not(.active) { transform: scale(1.07); }
        .glaze-drip-ui span { font-size: 1.6rem; line-height: 1; }

        .topping-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
        .topping-item {
            background: white; border: 2.5px solid #dde; border-radius: 50px;
            padding: 9px 12px; display: flex; align-items: center; gap: 8px; cursor: pointer;
            font-size: 0.85rem; font-weight: 700;
            transition: all 0.15s cubic-bezier(0.2,0,0,1);
        }
        .topping-item.active {
            background: var(--shop-pink);
            border-color: var(--text-dark);
            color: white;
            box-shadow: 3px 3px 0 var(--text-dark);
            transform: translate(-2px, -2px);
        }
        .topping-item:hover:not(.active) { border-color: var(--shop-pink); background: #fff0f8; }

        /* Slider row: feather — slider — rock */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0 4px;
        }
        .slider-icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1; }
        .slider-label {
            text-align: center;
            font-family: 'Boogaloo', cursive;
            font-size: 1rem;
            letter-spacing: 4px;
            color: var(--purple);
            margin-bottom: 0.3rem;
        }
        .slider-label span {
            color: var(--text-dark);
            background: #ede0fc;
            border-radius: 6px;
            padding: 1px 8px;
            margin-left: 4px;
            letter-spacing: 0;
            font-size: 0.9rem;
        }

        /* Purple range input */
        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%; height: 9px;
            border-radius: 50px;
            outline: none;
            cursor: pointer;
            border: none;
            /* initial fill set by updateSlider() on load */
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--purple);
            border: 3px solid #fff;
            box-shadow: 0 2px 0 var(--text-dark), 0 0 0 2px var(--purple);
            cursor: pointer;
        }
        .slider::-moz-range-thumb {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--purple);
            border: 3px solid #fff;
            box-shadow: 0 2px 0 var(--text-dark);
            cursor: pointer;
        }

        .btn-primary {
            width: 100%; background: #4ade80; color: var(--text-dark); border: 4px solid var(--text-dark);
            padding: 1.1rem; font-size: 1.5rem; font-weight: 400; border-radius: 50px;
            margin-top: 2rem; cursor: pointer; box-shadow: 0 6px 0 var(--text-dark);
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: 'Boogaloo', cursive;
            letter-spacing: 3px;
        }
        .btn-primary:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--text-dark); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        @keyframes roast-wiggle {
            0%   { transform: rotate(0deg)   translateY(0); box-shadow: 0 6px 0 var(--text-dark); }
            15%  { transform: rotate(-2deg)  translateY(-4px); }
            35%  { transform: rotate(2.5deg) translateY(-5px); }
            55%  { transform: rotate(-2deg)  translateY(-3px); }
            75%  { transform: rotate(1.5deg) translateY(-2px); }
            100% { transform: rotate(0deg)   translateY(0); box-shadow: 0 6px 0 var(--text-dark); }
        }
        .btn-primary.wiggling {
            animation: roast-wiggle 0.45s ease-in-out;
            pointer-events: none;
        }

        /* CANVAS OVERLAY */
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10; display: none; opacity: 0; transition: opacity 0.8s ease;
            pointer-events: none;
        }

        /* VERDICT OVERLAY */
        #verdict-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 107, 158, 0.3); backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 15; display: none; opacity: 0; transition: opacity 0.6s ease;
        }

        #verdict-container {
            position: fixed;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5) translateY(100px);
            background: var(--shop-white); border: 6px solid var(--text-dark);
            border-radius: 30px;
            padding-top: 3.5rem;
            padding-bottom: 0;
            z-index: 20;
            display: none; opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 90%; max-width: 450px;
            max-height: 82vh;
            flex-direction: column; align-items: center;
            box-shadow: 0px 20px 0px rgba(74, 44, 42, 0.15);
        }

        #verdict-container.show {
            opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0);
        }

        .verdict-scroll-area {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1.5rem;
        }
        
        /* Custom styled scrollbars for the new scroll area */
        .verdict-scroll-area::-webkit-scrollbar { width: 6px; }
        .verdict-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .verdict-scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .score-badge {
            position: absolute; 
            top: -50px; left: 50%; margin-left: -50px; 
            background: var(--shop-yellow);
            width: 100px; height: 100px; border: 6px solid var(--text-dark);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: 'Boogaloo', cursive;
            font-size: 2.4rem; font-weight: 400; transform: rotate(10deg);
            box-shadow: 5px 5px 0 var(--purple);
            z-index: 25; 
        }

        #chef-title { margin-top: 0; color: var(--text-dark); text-transform: uppercase; font-size: 1.3rem; font-family: 'Boogaloo', cursive; letter-spacing: 2px; }
        
        #verdict-text {
            font-family: 'Nunito', sans-serif; font-size: 1.05rem; font-weight: 700; line-height: 1.55; text-align: center;
            margin-bottom: 1.5rem; color: #333; min-height: 80px;
        }

        .chef-switcher {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .chef-btn {
            flex: 1 1 calc(33.333% - 8px); 
            min-width: 80px;
            padding: 0.5rem 0.3rem 0.4rem;
            border: 3px solid var(--text-dark);
            border-radius: 12px;
            font-size: 0.72rem; font-weight: 800;
            cursor: pointer;
            background: white;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            line-height: 1;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 0.5px;
        }
        .chef-btn .chef-icon { font-size: 1.3rem; }

        /* Per-chef brand colours */
        .chef-btn[data-chef="Jacques"] { border-color: #1A3F8A; color: #1A3F8A; }
        .chef-btn[data-chef="Fieri"]   { border-color: #C84800; color: #C84800; }
        .chef-btn[data-chef="Gordon"]  { border-color: #990000; color: #990000; }

        .chef-btn[data-chef="Jacques"].active { background:#1A3F8A; color:#fff; box-shadow:2px 2px 0 var(--text-dark); transform:translate(-1px,-1px); }
        .chef-btn[data-chef="Fieri"].active   { background:#C84800; color:#fff; box-shadow:2px 2px 0 var(--text-dark); transform:translate(-1px,-1px); }
        .chef-btn[data-chef="Gordon"].active  { background:#990000; color:#fff; box-shadow:2px 2px 0 var(--text-dark); transform:translate(-1px,-1px); }

        /* FRESH / FAIL ribbon */
        .verdict-ribbon {
            position: absolute;
            top: 18px;
            font-family: 'Comic Sans MS', "Chalkboard SE", "Marker Felt", sans-serif;
            font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
            padding: 3px 12px;
            border: 2px solid var(--text-dark);
            border-radius: 4px;
            box-shadow: 2px 2px 0 var(--text-dark);
            display: none;
            z-index: 30;
        }
        .verdict-ribbon.fresh {
            right: 12px;
            background: var(--shop-yellow);
            color: var(--text-dark);
            transform: rotate(3deg);
        }
        .verdict-ribbon.fail {
            left: 12px;
            background: #dc2626;
            color: white;
            transform: rotate(-3deg);
        }

        /* Tiny camera easter egg */
        .btn-camera-egg {
            background: none;
            border: none;
            font-size: 1.1rem;
            opacity: 0.25;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: opacity 0.2s;
            align-self: center;
        }
        .btn-camera-egg:hover { opacity: 0.65; }

        #generated-image-container {
            width: 100%; aspect-ratio: 1; background: #eee; border-radius: 15px;
            margin-top: 0.5rem; margin-bottom: 1rem; display: none; overflow: hidden;
            border: 2px solid var(--text-dark); flex: 0 0 auto;
            align-items: center; justify-content: center;
        }
        #generated-image-container img { width: 100%; height: 100%; object-fit: cover; }

        .btn-rebake {
            background: var(--shop-yellow); color: var(--text-dark); border: 4px solid var(--text-dark);
            padding: 1rem 2rem; font-size: 1.6rem; font-weight: 400; border-radius: 30px;
            cursor: pointer; box-shadow: 0 6px 0 var(--text-dark);
            transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; letter-spacing: 3px;
            width: 100%;
            font-family: 'Boogaloo', cursive;
        }
        .btn-rebake:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--text-dark); }

        /* Pinned footer inside the verdict card */
        .verdict-footer {
            flex: 0 0 auto;
            width: 100%;
            padding: 0.75rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            border-top: 2px solid #f0e8f8;
        }

        /* CSS donut spinner for loading states */
        @keyframes donut-spin { to { transform: rotate(360deg); } }
        .donut-spinner {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 7px solid #ede0fc;
            border-top-color: var(--purple);
            border-right-color: var(--shop-pink);
            animation: donut-spin 0.9s linear infinite;
            margin: 1.5rem auto;
            flex-shrink: 0;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <!-- Low-poly background: pink + purple triangles at edges -->
    <canvas id="poly-bg"></canvas>

    <header id="header">
        <img src="dough-drop.png" alt="Dough Drop Icon" class="app-icon">
        <h1>Dough Drop</h1>
    </header>

    <main id="builder">
        <label class="section-label">🍩 BASE</label>
        <div class="visual-grid">
            <div class="visual-card active" onclick="selectType('Fluffy', this)"><span>Fluffy</span></div>
            <div class="visual-card" onclick="selectType('Cake', this)"><span>Cake</span></div>
        </div>

        <div id="cake-options" style="display: none;">
            <label class="section-label">🍰 Cake Flavor</label>
            <div class="visual-grid">
                <div class="visual-card active" onclick="selectFlavor('Vanilla', this)"><span>Vanilla</span></div>
                <div class="visual-card" onclick="selectFlavor('Chocolate', this)"><span>Chocolate</span></div>
            </div>
        </div>

        <label class="section-label">🎨 FROSTING</label>
        <div class="glaze-row">
            <div class="glaze-drip-ui" style="background:#4a2c2a;" onclick="selectGlaze('Chocolate', this, '#4a2c2a')">
                <span style="font-size:1.8rem;" title="Chocolate">🍫</span>
            </div>
            <div class="glaze-drip-ui" style="background:#ff6b9e;" onclick="selectGlaze('Strawberry', this, '#ff6b9e')">
                <span style="font-size:1.8rem;" title="Strawberry">🍓</span>
            </div>
            <div class="glaze-drip-ui" style="background:#c68642;" onclick="selectGlaze('Maple', this, '#c68642')">
                <span style="font-size:1.8rem;" title="Maple">🍁</span>
            </div>
            <div class="glaze-drip-ui active" style="background:#fdf5e6;" onclick="selectGlaze('Vanilla', this, '#fdf5e6')">
                <span style="font-size:1.8rem;" title="Vanilla">🍦</span>
            </div>
        </div>

        <label class="section-label">✨ Toppings</label>
        <div class="topping-grid" id="topping-container"></div>

        <div class="slider-row">
            <span class="slider-icon">🪶</span>
            <input type="range" min="0" max="1000" value="400" class="slider" id="topping-qty" oninput="updateSlider(this)">
            <span class="slider-icon">🪨</span>
        </div>
        <div class="slider-label">LOAD<span id="qty-label">400</span></div>

        <button class="btn-primary" id="btn-submit" onclick="startReview()">ROAST! 🔥</button>
    </main>

    <div id="canvas-container"></div>
    
    <div id="verdict-backdrop"></div>
    
    <div id="verdict-container">
        <div class="score-badge" id="score-display">?</div>
        <div class="verdict-ribbon" id="verdict-ribbon"></div>

        <!-- Scrollable area: just the roast text + generated photo -->
        <div class="verdict-scroll-area">
            <h2 id="chef-title">Gordon Ramsay Says:</h2>
            <div id="verdict-text">Consulting the culinary gods...</div>
            <div id="generated-image-container"></div>
        </div>

        <!-- Pinned footer: always visible below the roast text -->
        <div class="verdict-footer">
            <div class="chef-switcher" id="chef-switcher">
                <button class="chef-btn" data-chef="Jacques" id="btn-jacques" onclick="switchChef('Jacques')">
                    <span class="chef-icon">🎩</span>JACQUES
                </button>
                <button class="chef-btn" data-chef="Fieri" id="btn-fieri" onclick="switchChef('Fieri')">
                    <span class="chef-icon">🔥</span>GUY
                </button>
                <button class="chef-btn active" data-chef="Gordon" id="btn-gordon" onclick="switchChef('Gordon')">
                    <span class="chef-icon">⭐</span>GORDON
                </button>
            </div>
            <button class="btn-rebake" id="btn-rebake" onclick="location.reload()">🔄 REROAST!</button>
            <!-- Easter egg: barely visible camera -->
            <button class="btn-camera-egg" id="btn-visualize" onclick="generateDonutImage()" title="shhh">📸</button>
        </div>
    </div>

    <script>
        // ── LOW-POLY BACKGROUND ─────────────────────────────────────────────────
        (function() {
            const canvas = document.getElementById('poly-bg');
            function draw() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
                const W = canvas.width, H = canvas.height;
                const ctx = canvas.getContext('2d');

                // Seeded PRNG (xorshift32) — same triangles every paint
                let seed = 0xD06EB4FF;
                const rng = () => {
                    seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5;
                    return (seed >>> 0) / 0xFFFFFFFF;
                };

                const COLS = 9, ROWS = 16;
                const cw = W / COLS, ch = H / ROWS;
                const pts = [];
                for (let r = 0; r <= ROWS; r++) {
                    for (let c = 0; c <= COLS; c++) {
                        const edge = (c===0||c===COLS||r===0||r===ROWS);
                        pts.push({
                            x: Math.max(0,Math.min(W, c*cw + (edge?0:(rng()-.5)*cw*.72))),
                            y: Math.max(0,Math.min(H, r*ch + (edge?0:(rng()-.5)*ch*.72)))
                        });
                    }
                }

                function tri(a, b, c2) {
                    const cx=(a.x+b.x+c2.x)/3, cy=(a.y+b.y+c2.y)/3;
                    const d = Math.min(cx, W-cx, cy, H-cy);
                    const threshold = Math.min(W,H) * 0.27;
                    if (d > threshold) return;
                    const alpha = (1 - d/threshold) * 0.52;
                    // Purple near corners, pink elsewhere in the edge zone
                    const cornerDist = Math.min(
                        Math.hypot(cx,cy), Math.hypot(W-cx,cy),
                        Math.hypot(cx,H-cy), Math.hypot(W-cx,H-cy)
                    );
                    const isPurple = cornerDist < Math.min(W,H)*0.30 && rng() > 0.40;
                    const h = isPurple ? 265+rng()*35 : 318+rng()*28;
                    const s = isPurple ? 52+rng()*28  : 62+rng()*24;
                    const l = isPurple ? 24+rng()*24  : 46+rng()*22;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c2.x,c2.y);
                    ctx.closePath();
                    ctx.fillStyle = `hsl(${h},${s}%,${l}%)`;
                    ctx.fill();
                    ctx.strokeStyle = `hsla(${h},${s}%,${Math.max(l-12,18)}%,0.45)`;
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                    ctx.restore();
                }

                for (let r=0; r<ROWS; r++) {
                    for (let c=0; c<COLS; c++) {
                        const i = r*(COLS+1)+c;
                        tri(pts[i], pts[i+1], pts[i+COLS+1]);
                        tri(pts[i+1], pts[i+COLS+2], pts[i+COLS+1]);
                    }
                }
            }
            draw();
            window.addEventListener('resize', draw);
        })();

        const apiKey = "";
        let state = { 
            type: "Fluffy", 
            flavor: "Vanilla", 
            glaze: "Vanilla", 
            glazeHex: "#fdf5e6", 
            selectedToppings: [],
            currentChef: 'Gordon',
            reviews: {} 
        };

        // Purple slider fill + live value label
        function updateSlider(el) {
            const pct = ((el.value - el.min) / (el.max - el.min) * 100).toFixed(1);
            el.style.background = `linear-gradient(to right, var(--purple) ${pct}%, #e0d0f0 ${pct}%)`;
            document.getElementById('qty-label').innerText = el.value;
        }
        // Init slider on load
        window.addEventListener('DOMContentLoaded', () => {
            const sl = document.getElementById('topping-qty');
            if (sl) updateSlider(sl);
            // ROAST wiggle

            const isEasterEgg = state.type === 'Cake' && state.flavor === 'Vanilla' && state.glaze === 'Strawberry' && state.selectedToppings.length === 1 && state.selectedToppings[0].name === 'Rainbow Sprinkles';
            
            if (isEasterEgg && chefKey === 'Jacques') {
                return {
                    critique: "Mon Dieu... *wipes away a single tear*. I wanted to despise it. It is so pedestrian, so profoundly un-French. But the dense crumb... the unapologetic pink sweetness... the joyful crunch of the rainbow sprinkles... I surrender! It transcends critique! It is an AMERICAN CLASSIC!!",
                    score: 11
                };
            }

            const userQuery = `Critique this pastry: A ${state.type} donut (${state.type === 'Cake' ? state.flavor : 'Yeast'}) with ${state.glaze} glaze and the following toppings: ${state.selectedToppings.map(t => t.name).join(', ') || 'None'}. Return JSON format: {"critique": "your text here", "score": 8.5}`;
            
            try {
                const response = await fetch(`/.netlify/functions/api`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: 'review',
                        query: userQuery,
                        system: chefs[chefKey].system
                    })
                });
                
                if (!response.ok) {
                    const err = await response.text();
                    return { critique: `Proxy Error (${response.status}): ${err}`, score: 0 };
                }
                
                const data = await response.json();
                
                if (data.error) {
                    return { critique: `Google API Error: ${data.error.message || "Unknown"}`, score: 0 };
                }
                
                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/g, '').replace(/```/g, ''); 
                return JSON.parse(rawText);
            } catch (e) {
                return { critique: `Connection Failed: ${e.message}`, score: 0 };
            }
        }

        let scene, camera, renderer, donutGroup, frostingGroup, rackGroup, toppingGroup, sharedFrostingMat;

        function createRack() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });
            const wireRadius = 0.04;
            for(let i = -8; i <= 8; i++) {
                const geoH = new THREE.CylinderGeometry(wireRadius, wireRadius, 16, 8);
                const wireH = new THREE.Mesh(geoH, mat);
                wireH.rotation.z = Math.PI / 2; wireH.position.z = i * 0.7;
                wireH.castShadow = true; wireH.receiveShadow = true;
                group.add(wireH);
                const geoV = new THREE.CylinderGeometry(wireRadius, wireRadius, 16, 8);
                const wireV = new THREE.Mesh(geoV, mat);
                wireV.rotation.x = Math.PI / 2; wireV.position.x = i * 0.7; wireV.position.y = -wireRadius * 2; 
                wireV.castShadow = true; wireV.receiveShadow = true;
                group.add(wireV);
            }
            group.position.y = -1.45; 
            return group;
        }

        function createGlaze(isCake, donutR, tubeR) {
            const group = new THREE.Group();
            sharedFrostingMat = new THREE.MeshStandardMaterial({ 
                color: state.glazeHex, roughness: 0.08, metalness: 0.0,
                transparent: true, opacity: 0, side: THREE.DoubleSide
            });

            // ── Frosting cap (LatheGeometry arc over the top of the torus) ──
            const points = [];
            const segments = 32;
            const startAngle = isCake ? -Math.PI * 0.4 : -Math.PI * 0.5;
            const endAngle   = isCake ?  Math.PI * 0.45 :  Math.PI * 0.55;
            for (let i = 0; i <= segments; i++) {
                const angle = startAngle + (i / segments) * (endAngle - startAngle); 
                points.push(new THREE.Vector2(
                    donutR + Math.sin(angle) * tubeR,
                    Math.cos(angle) * tubeR
                ));
            }
            const topMesh = new THREE.Mesh(new THREE.LatheGeometry(points, 64), sharedFrostingMat);
            topMesh.castShadow = true; topMesh.receiveShadow = true;
            group.add(topMesh);

            // ── Teardrop drip profile builder ──
            function makeDripProfile(len, topW) {
                const pts = [];
                const steps = 20;
                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    let r;
                    if (t < 0.14) {
                        // Wide pooling lip at attachment
                        r = topW * (1 - (t / 0.14) * 0.3);
                    } else if (t < 0.62) {
                        // Stem narrows
                        const s = (t - 0.14) / 0.48;
                        r = topW * 0.70 * (1 - s * 0.68);
                    } else {
                        // Teardrop belly
                        const s = (t - 0.62) / 0.38;
                        const stemR = topW * 0.70 * 0.32;
                        r = stemR + Math.sin(s * Math.PI) * topW * 0.52;
                    }
                    pts.push(new THREE.Vector2(Math.max(0.008, r), -t * len));
                }
                return pts;
            }

            // ── Outer-edge drips ──
            const outerAngle  = endAngle - 0.05;
            const oEdgeR      = donutR + Math.sin(outerAngle) * tubeR; // radial dist
            const oEdgeY      = Math.cos(outerAngle) * tubeR;          // height
            const outerCount  = isCake ? 18 : 13;

            for (let i = 0; i < outerCount; i++) {
                // Jittered angle so drips aren't perfectly evenly spaced
                const baseAngle = (i / outerCount) * Math.PI * 2;
                const angle     = baseAngle + (Math.random() - 0.5) * (Math.PI * 2 / outerCount) * 0.65;
                const len       = isCake ? (0.55 + Math.random() * 1.3) : (0.28 + Math.random() * 0.68);
                const topW      = 0.14 + Math.random() * 0.09;

                const dripGeo  = new THREE.LatheGeometry(makeDripProfile(len, topW), 10);
                const drip     = new THREE.Mesh(dripGeo, sharedFrostingMat);
                drip.position.set(Math.cos(angle) * oEdgeR, oEdgeY, Math.sin(angle) * oEdgeR);
                drip.castShadow = true;
                group.add(drip);
            }

            // ── Inner-edge drips (into the hole) ──
            const innerAngle = startAngle + 0.05;
            const iEdgeR     = donutR + Math.sin(innerAngle) * tubeR;
            const iEdgeY     = Math.cos(innerAngle) * tubeR;
            const innerCount = isCake ? 8 : 5;

            for (let i = 0; i < innerCount; i++) {
                const baseAngle = (i / innerCount) * Math.PI * 2;
                const angle     = baseAngle + (Math.random() - 0.5) * (Math.PI * 2 / innerCount) * 0.7;
                const len       = 0.18 + Math.random() * 0.38;
                const topW      = 0.08 + Math.random() * 0.06;

                const dripGeo  = new THREE.LatheGeometry(makeDripProfile(len, topW), 8);
                const drip     = new THREE.Mesh(dripGeo, sharedFrostingMat);
                drip.position.set(Math.cos(angle) * iEdgeR, iEdgeY, Math.sin(angle) * iEdgeR);
                drip.castShadow = true;
                group.add(drip);
            }

            return group;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            scene = new THREE.Scene();

            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            window.addEventListener('resize', () => {
                if(camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.15 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2; floor.position.y = -1.8; floor.receiveShadow = true;
            scene.add(floor);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
            keyLight.position.set(5, 15, 8);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 1024;
            keyLight.shadow.mapSize.height = 1024;
            scene.add(keyLight);
            const fillLight = new THREE.PointLight(0xffffff, 0.3);
            fillLight.position.set(-6, 4, -4);
            scene.add(fillLight);
            
            donutGroup = new THREE.Group();
            scene.add(donutGroup);
            rackGroup = createRack();
            scene.add(rackGroup);
            toppingGroup = new THREE.Group();
            scene.add(toppingGroup);
            
            const isCake = state.type === 'Cake';
            const donutR = isCake ? 2.4 : 2.9;
            const tubeR = isCake ? 1.35 : 1.15;
            const glazeTubeR = isCake ? 1.42 : 1.20;
            const cakeColor = (isCake && state.flavor === 'Chocolate') ? 0x2a140c : 0xc48035;
            
            const cakeGeo = new THREE.TorusGeometry(donutR, tubeR, 64, 100);
            const cakeMat = new THREE.MeshStandardMaterial({ color: cakeColor, roughness: 1.0 });
            const cake = new THREE.Mesh(cakeGeo, cakeMat);
            cake.rotation.x = Math.PI/2;
            cake.castShadow = true; cake.receiveShadow = true;
            donutGroup.add(cake);
            
            frostingGroup = createGlaze(isCake, donutR, glazeTubeR);
            donutGroup.add(frostingGroup);
            donutGroup.userData = { donutR, tubeR: glazeTubeR };
            donutGroup.position.y = 15;
            camera.position.set(0, 12, 22);
            camera.lookAt(0, -1, 0);
        }

        async function animatePastry() {
            let phase = 'drop';
            const targetQty = parseInt(document.getElementById('topping-qty').value);
            const sprinkles = [];

            let currentToppingIndex = 0;
            const numToppingTypes = state.selectedToppings.length;
            const qtyPerTopping = numToppingTypes > 0 ? Math.ceil(targetQty / numToppingTypes) : 0;
            let currentToppingCount = 0;

            // One geometry per topping type, reused across all particles of that type.
            // Random size variation is applied via mesh.scale instead of new geometry each time.
            const geoCache = {};
            function getGeo(type) {
                if (geoCache[type]) return geoCache[type];
                let geo;
                if (type === 'cylinder') {
                    geo = new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6);
                    geo.rotateX(Math.PI / 2);
                } else if (type === 'flake') {
                    geo = new THREE.BoxGeometry(0.20, 0.02, 0.20);
                } else if (type === 'dust') {
                    geo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
                } else if (type === 'crunch') {
                    geo = new THREE.BoxGeometry(0.20, 0.20, 0.20);
                } else if (type === 'chip') {
                    geo = new THREE.TetrahedronGeometry(0.10);
                } else {
                    geo = new THREE.BoxGeometry(0.10, 0.10, 0.10);
                }
                geoCache[type] = geo;
                return geo;
            }

            // One material per color hex, reused across all particles of that color.
            const matCache = {};
            function getMat(color) {
                if (matCache[color]) return matCache[color];
                matCache[color] = new THREE.MeshPhongMaterial({ color, shininess: 30 });
                return matCache[color];
            }

            return new Promise(resolve => {
                function run() {
                    donutGroup.rotation.y += 0.003;
                    rackGroup.rotation.y += 0.003;
                    
                    if (phase === 'drop') {
                        donutGroup.position.y -= 0.6;
                        if (donutGroup.position.y <= 0) {
                            donutGroup.position.y = 0; 
                            donutGroup.scale.set(1.15, 0.7, 1.15); 
                            phase = 'rebound';
                        }
                    } else if (phase === 'rebound') {
                        donutGroup.scale.x += (1 - donutGroup.scale.x) * 0.15;
                        donutGroup.scale.y += (1 - donutGroup.scale.y) * 0.15;
                        if (Math.abs(1 - donutGroup.scale.y) < 0.01) { 
                            donutGroup.scale.set(1, 1, 1); 
                            phase = 'glaze'; 
                        }
                    } else if (phase === 'glaze') {
                        if (sharedFrostingMat) {
                            sharedFrostingMat.opacity += 0.04;
                            if (sharedFrostingMat.opacity >= 1.0) {
                                sharedFrostingMat.opacity = 1.0;
                                phase = 'toppings';
                            }
                        } else { phase = 'toppings'; }
                    } else if (phase === 'toppings') {
                        if (state.selectedToppings.length === 0 || targetQty === 0) {
                            phase = 'done';
                        } else {
                            // 1. Generate new sprinkles if we haven't reached the target
                            if (sprinkles.length < targetQty && currentToppingIndex < numToppingTypes) {
                                const dropRate = Math.min(25, Math.max(10, Math.floor(targetQty / 20)));
                                let addedThisFrame = 0;

                                for(let i=0; i<dropRate; i++) {
                                    if(sprinkles.length >= targetQty) break;
                                    const topCfg = state.selectedToppings[currentToppingIndex];

                                    // Reuse cached geometry; apply per-particle size jitter via scale
                                    const geo = getGeo(topCfg.type);
                                    const color = topCfg.colors[Math.floor(Math.random() * topCfg.colors.length)];
                                    const mat = getMat(color);
                                    const mesh = new THREE.Mesh(geo, mat);

                                    // Quantity-based size scale + per-particle variation (replaces random geometry sizes)
                                    const sizeScale = 1 + (targetQty / 1000) * 0.5;
                                    let varX = 1, varY = 1, varZ = 1;
                                    if (topCfg.type === 'flake') {
                                        const v = 0.75 + Math.random() * 0.5; varX = v; varZ = v;
                                    } else if (topCfg.type === 'dust' || topCfg.type === 'crunch' || topCfg.type === 'chip') {
                                        const v = 0.75 + Math.random() * 0.5; varX = v; varY = v; varZ = v;
                                    }
                                    mesh.scale.set(sizeScale * varX, sizeScale * varY, sizeScale * varZ);
                                    
                                    const angle = Math.random() * Math.PI * 2;
                                    
                                    // FIX 2: Widen the spread significantly at max slider to spill off sides/into the hole
                                    const spreadMultiplier = 1.4 + (targetQty / 1000) * 1.6;
                                    const spread = (Math.random() - 0.5) * spreadMultiplier * donutGroup.userData.tubeR;
                                    const radius = donutGroup.userData.donutR + spread;
                                    
                                    mesh.position.x = Math.cos(angle) * radius;
                                    mesh.position.z = Math.sin(angle) * radius;
                                    mesh.position.y = 5 + Math.random() * 5; 
                                    
                                    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                                    
                                    toppingGroup.add(mesh);
                                    
                                    // Calculate exact landing height based on the curve of the torus
                                    let surfaceY;
                                    if (Math.abs(spread) > donutGroup.userData.tubeR * 0.95) {
                                        // Missed the frosting! Fall down to the cooling rack
                                        surfaceY = -1.4;
                                    } else {
                                        surfaceY = Math.sqrt(Math.max(0, donutGroup.userData.tubeR * donutGroup.userData.tubeR - spread * spread));
                                    }
                                    
                                    // Dynamic padding so thicker toppings don't half-clip into the frosting
                                    let padding = 0.05;
                                    if (topCfg.type === 'cylinder') padding = 0.12;
                                    else if (topCfg.type === 'crunch' || topCfg.type === 'chip') padding = 0.08;
                                    padding *= sizeScale;
                                    
                                    // FIX 3: Let them pile up vertically so it stacks thick!
                                    const pileUpHeight = Math.random() * (targetQty / 1000) * 0.8;
                                    
                                    sprinkles.push({ mesh, targetY: surfaceY + padding + pileUpHeight });
                                    addedThisFrame++;
                                }
                                currentToppingCount += addedThisFrame;
                                if (currentToppingCount >= qtyPerTopping) {
                                    currentToppingIndex++;
                                    currentToppingCount = 0;
                                }
                            }
                            
                            // 2. Animate ALL existing sprinkles down simultaneously
                            let allSettled = true;
                            for (let i = 0; i < sprinkles.length; i++) {
                                const sp = sprinkles[i];
                                if (sp.mesh.position.y > sp.targetY) {
                                    sp.mesh.position.y -= 0.3; // Speed of the rain
                                    // FIX 3: Snap to targetY so they never overshoot and bury themselves inside the 3D model
                                    if (sp.mesh.position.y <= sp.targetY) {
                                        sp.mesh.position.y = sp.targetY;
                                    } else {
                                        allSettled = false;
                                    }
                                }
                            }
                            
                            // 3. Move to the next phase only when generation AND falling are both complete
                            const doneGenerating = sprinkles.length >= targetQty || currentToppingIndex >= numToppingTypes;
                            if (doneGenerating && allSettled) {
                                phase = 'done';
                            }
                        }
                    } else if (phase === 'done') {
                        resolve();
                        return;
                    }

                    renderer.render(scene, camera);
                    requestAnimationFrame(run);
                }
                run();
            });
        }

                init3D();
                
                // Fixed forever: Route initial load directly through your secure proxy helper
                const initialReviewPromise = getChefReview(state.currentChef);

                animatePastry().then(async () => {
                    const animEndTime = Date.now();

                    // Keep the donut spinning while we wait for the API and the admiration window
                    let idleActive = true;
                    (function idleSpin() {
                        if (!idleActive) return;
                        donutGroup.rotation.y  += 0.003;
                        rackGroup.rotation.y   += 0.003;
                        toppingGroup.rotation.y += 0.003;
                        renderer.render(scene, camera);
                        requestAnimationFrame(idleSpin);
                    })();

                    const review = await initialReviewPromise;
                    state.reviews[state.currentChef] = review;
                    displayReview(review);

                    // Always give at least 1s of donut admiration; if the API was
                    // slow (> 1s after animation ended) show immediately — no extra wait.
                    const elapsed = Date.now() - animEndTime;
                    const delay = Math.max(0, 1000 - elapsed);

                    setTimeout(() => {
                        idleActive = false;
                        const vBackdrop = document.getElementById('verdict-backdrop');
                        const vContainer = document.getElementById('verdict-container');
                        vBackdrop.style.display = 'block';
                        vContainer.style.display = 'flex';
                        setTimeout(() => {
                            vBackdrop.style.opacity = '1';
                            vContainer.classList.add('show');
                        }, 50);
                    }, delay);
                });
            }, 400); 
        }
    </script>
</body>
</html>
