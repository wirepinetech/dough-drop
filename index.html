<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dough Drop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --shop-pink: #ff6b9e;
            --shop-yellow: #fcd34d;
            --shop-white: #ffffff;
            --shop-cream: #fff9f0;
            --text-dark: #4a2c2a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Comic Sans MS', "Chalkboard SE", "Marker Felt", sans-serif;
            background-color: var(--shop-pink);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.2) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 1.5rem;
            transition: opacity 0.4s;
        }

        h1 {
            color: var(--shop-white);
            text-shadow: 2px 2px 0 var(--text-dark), -2px -2px 0 var(--text-dark), 2px -2px 0 var(--text-dark), -2px 2px 0 var(--text-dark);
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 2px;
        }

        #builder {
            background: var(--shop-cream);
            border: 4px solid var(--text-dark);
            border-radius: 20px;
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 0 var(--text-dark);
            transition: opacity 0.4s;
            margin-bottom: 2rem;
        }

        .category-title {
            font-size: 1.2rem;
            margin: 10px 0;
            border-bottom: 2px dashed var(--shop-pink);
            padding-bottom: 5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .opt-btn {
            background: var(--shop-white);
            border: 2px solid var(--text-dark);
            border-radius: 12px;
            padding: 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .opt-btn:active { transform: translateY(2px); }
        .opt-btn.selected { background: var(--shop-yellow); }

        .bake-btn {
            width: 100%;
            background: var(--shop-pink);
            color: var(--shop-white);
            border: 4px solid var(--text-dark);
            border-radius: 15px;
            padding: 15px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: bold;
            text-shadow: 1px 1px 0 var(--text-dark);
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 0 var(--text-dark);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .bake-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--text-dark);
        }

        #canvas-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s;
            background: var(--shop-pink);
        }

        /* --- VERDICT MODAL STYLES --- */
        #verdict-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #verdict-container {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -40%);
            width: 90%;
            max-width: 450px;
            
            /* FIX 3: Badge Safe Zone */
            max-height: 85vh; /* Prevents stretching off screen */
            margin-top: 25px; /* Extra room at top for the badge */
            padding: 3.5rem 1.5rem 1.5rem 1.5rem; /* pt-3.5rem safely houses the badge */
            
            background: var(--shop-cream);
            border: 4px solid var(--text-dark);
            border-radius: 20px;
            flex-direction: column;
            z-index: 101;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #verdict-container.show {
            transform: translate(-50%, -50%);
            opacity: 1;
        }

        .score-badge {
            position: absolute;
            top: -40px; /* Popped out, but kept safe by container margin */
            left: 50%;
            transform: translateX(-50%);
            background: var(--shop-yellow);
            border: 4px solid var(--text-dark);
            border-radius: 50%;
            width: 80px; height: 80px;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 2rem; font-weight: bold;
            box-shadow: 0 5px 0 var(--text-dark);
            z-index: 102;
        }

        /* FIX 1: Scrollable Inner Content Area */
        .verdict-scroll-area {
            overflow-y: auto;
            flex: 1 1 auto; /* Allows expanding to fill available space, but scrolling when full */
            min-height: 0; /* Critical for flex scrolling */
            margin-bottom: 15px;
            padding-right: 5px; /* Breathing room for scrollbar */
            font-size: 1.1rem;
            line-height: 1.4;
        }

        /* Custom fun scrollbar */
        .verdict-scroll-area::-webkit-scrollbar { width: 8px; }
        .verdict-scroll-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
        .verdict-scroll-area::-webkit-scrollbar-thumb { background: var(--shop-pink); border-radius: 4px; border: 2px solid var(--text-dark); }

        /* FIX 2: Responsive Chef Buttons */
        .chef-controls {
            display: flex;
            flex-wrap: wrap; /* Allows buttons to stack gracefully on tiny screens */
            gap: 8px;
            justify-content: center;
            flex: 0 0 auto;
            margin-bottom: 15px;
        }

        .chef-btn {
            flex: 1 1 calc(33.333% - 8px); /* Stretch to fit evenly */
            min-width: 80px; /* Prevent them from squishing into unreadable text */
            padding: 8px 5px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            background: var(--shop-white);
            border: 2px solid var(--text-dark);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chef-btn.active {
            background: var(--shop-pink);
            color: var(--shop-white);
            border-color: var(--text-dark);
            box-shadow: 0 3px 0 var(--text-dark);
            transform: translateY(-2px);
        }

        .action-controls {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .take-pic-btn, .restart-btn {
            width: 100%;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            border: 3px solid var(--text-dark);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.1s;
        }

        .take-pic-btn { background: var(--shop-yellow); box-shadow: 0 4px 0 var(--text-dark); }
        .restart-btn { background: var(--shop-white); }
        
        .take-pic-btn:active, .restart-btn:active { transform: translateY(3px); box-shadow: none; }
    </style>
</head>
<body>

    <header id="header">
        <h1>🍩 Dough Drop</h1>
    </header>

    <div id="builder">
        <div class="category-title">Base</div>
        <div class="options-grid" id="grid-base">
            <button class="opt-btn selected" onclick="selectOpt('base', 'Fluffy')">Fluffy</button>
            <button class="opt-btn" onclick="selectOpt('base', 'Cake')">Cake</button>
        </div>

        <div class="category-title">Frosting</div>
        <div class="options-grid" id="grid-frosting">
            <button class="opt-btn selected" onclick="selectOpt('frosting', 'Chocolate')">Chocolate</button>
            <button class="opt-btn" onclick="selectOpt('frosting', 'Strawberry')">Strawberry</button>
            <button class="opt-btn" onclick="selectOpt('frosting', 'Vanilla')">Vanilla</button>
            <button class="opt-btn" onclick="selectOpt('frosting', 'Maple')">Maple</button>
        </div>

        <div class="category-title">Toppings (Max 2)</div>
        <div class="options-grid" id="grid-toppings">
            <button class="opt-btn" onclick="toggleTopping('Sprinkles')">Sprinkles</button>
            <button class="opt-btn" onclick="toggleTopping('Chocolate Chips')">Choc Chips</button>
            <button class="opt-btn" onclick="toggleTopping('Bacon')">Bacon</button>
            <button class="opt-btn" onclick="toggleTopping('Coconut')">Coconut</button>
        </div>

        <button class="bake-btn" onclick="startReview()">Bake & Review!</button>
    </div>

    <div id="canvas-container"></div>

    <div id="verdict-backdrop"></div>
    <div id="verdict-container">
        <div class="score-badge"><span id="score-display">-</span>/10</div>
        
        <!-- FIX 1: Inner Scrollable Area -->
        <div class="verdict-scroll-area">
            <div id="verdict-text"><i>Tasting your creation...</i></div>
            <div id="ai-image-container"></div>
        </div>

        <!-- FIX 2: Responsive Flex-wrap Buttons -->
        <div class="chef-controls">
            <button id="btn-gordon" class="chef-btn active" onclick="switchChef('gordon')">Gordon</button>
            <button id="btn-jacques" class="chef-btn" onclick="switchChef('jacques')">Jacques</button>
            <button id="btn-guy" class="chef-btn" onclick="switchChef('guy')">Guy</button>
        </div>

        <div class="action-controls">
            <button class="take-pic-btn" onclick="takePicture()">📸 Take a Picture</button>
            <button class="restart-btn" onclick="location.reload()">Bake Another</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            base: 'Fluffy',
            frosting: 'Chocolate',
            toppings: [],
            currentChef: 'gordon',
            reviews: {} // Cache: { chefKey: { critique: "", score: 0 } }
        };

        const chefs = {
            gordon: { name: "Gordon Ramsay", role: "Angry Chef" },
            jacques: { name: "Jacques", role: "Harsh French Food Critic" },
            guy: { name: "Guy Fieri", role: "Mayor of Flavortown" }
        };

        // --- UI Logic ---
        function selectOpt(category, value) {
            state[category] = value;
            const btns = document.querySelectorAll(`#grid-${category} .opt-btn`);
            btns.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
        }

        function toggleTopping(value) {
            const btn = event.target;
            const index = state.toppings.indexOf(value);
            
            if (index > -1) {
                state.toppings.splice(index, 1);
                btn.classList.remove('selected');
            } else {
                if (state.toppings.length < 2) {
                    state.toppings.push(value);
                    btn.classList.add('selected');
                }
            }
        }

        // --- API Integration (Proxy Preserved) ---
        async function getChefReview(chefKey) {
            if (state.reviews[chefKey]) return state.reviews[chefKey];

            const chefData = chefs[chefKey];
            const toppingsStr = state.toppings.length > 0 ? state.toppings.join(' and ') : 'no toppings';
            const prompt = `You are ${chefData.name}, acting as a ${chefData.role}. Critique a donut made with a ${state.base} base, ${state.frosting} frosting, and ${toppingsStr}. Be highly in character, very animated, and brief (3-4 sentences max). End your response with a JSON object containing {"critique": "your review html", "score": number between 1 and 10}. Format the review with basic HTML tags like <b> or <i> for emphasis if needed.`;

            try {
                // Rule: Route through local proxy
                const response = await fetch('/.netlify/functions/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("API Error:", error);
                return { critique: "<b>Disaster!</b> The kitchen proxy caught on fire! (Network Error)", score: 0 };
            }
        }

        function switchChef(chefKey) {
            state.currentChef = chefKey;
            
            document.querySelectorAll('.chef-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${chefKey}`).classList.add('active');
            
            document.getElementById('verdict-text').innerHTML = `<i>${chefs[chefKey].name} is tasting...</i>`;
            
            getChefReview(chefKey).then(review => {
                state.reviews[chefKey] = review;
                document.getElementById('score-display').innerText = review.score;
                document.getElementById('verdict-text').innerHTML = review.critique;
            });
        }

        function takePicture() {
            const container = document.getElementById('ai-image-container');
            container.innerHTML = '<i><br/>Generating photorealistic masterpiece... 📸</i>';
            
            const toppingsStr = state.toppings.length > 0 ? state.toppings.join(' and ') : 'no toppings';
            const prompt = `A highly detailed, photorealistic 3D render of a single delicious donut with a ${state.base} base, ${state.frosting} frosting, and ${toppingsStr}. Bright pop art style, studio lighting, simple colorful pastel background.`;
            
            // Rule: Keyless direct endpoint
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=400&height=400&nologo=true`;
            
            const img = new Image();
            img.src = imgUrl;
            img.style.width = '100%';
            img.style.borderRadius = '15px';
            img.style.marginTop = '15px';
            img.style.border = '3px solid var(--text-dark)';
            
            img.onload = () => {
                container.innerHTML = '';
                container.appendChild(img);
                // Scroll to the bottom to reveal the new image
                const scrollArea = document.querySelector('.verdict-scroll-area');
                scrollArea.scrollTop = scrollArea.scrollHeight;
            };
        }

        // --- Three.js Setup (Simplified Placeholder logic for drop) ---
        let scene, camera, renderer, donut;

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.PointLight(0xffffff, 1, 100);
            light.position.set(10, 10, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // Basic Donut shape based on base choice
            const geometry = new THREE.TorusGeometry(2, 0.8, 16, 100);
            const material = new THREE.MeshPhongMaterial({ 
                color: state.base === 'Cake' ? 0xddb377 : 0xf5d6a1 
            });
            donut = new THREE.Mesh(geometry, material);
            
            // Start high up for the drop
            donut.position.y = 10;
            scene.add(donut);

            camera.position.z = 8;
        }

        function animatePastry() {
            return new Promise(resolve => {
                let frame = 0;
                function animate() {
                    if (frame > 100) {
                        resolve();
                        return;
                    }
                    requestAnimationFrame(animate);
                    
                    // Drop physics dummy
                    if (donut.position.y > 0) {
                        donut.position.y -= 0.2;
                    } else if (donut.position.y < 0) {
                        donut.position.y = 0;
                    }

                    donut.rotation.x += 0.02;
                    donut.rotation.y += 0.02;
                    renderer.render(scene, camera);
                    frame++;
                }
                animate();
            });
        }

        // --- Transition Flow ---
        function startReview() {
            const builder = document.getElementById('builder');
            const canvasContainer = document.getElementById('canvas-container');
            
            builder.style.opacity = '0';
            document.getElementById('header').style.opacity = '0';
            
            setTimeout(() => {
                builder.style.display = 'none';
                canvasContainer.style.display = 'block';
                setTimeout(() => canvasContainer.style.opacity = '1', 50);
                init3D();
                
                // Fixed forever: Route initial load directly through your secure proxy helper
                const initialReviewPromise = getChefReview(state.currentChef);

                animatePastry().then(async () => {
                    const review = await initialReviewPromise;
                    state.reviews[state.currentChef] = review;
                    
                    document.getElementById('score-display').innerText = `${review.score}`;
                    document.getElementById('verdict-text').innerHTML = review.critique;
                    
                    const vBackdrop = document.getElementById('verdict-backdrop');
                    const vContainer = document.getElementById('verdict-container');
                    vBackdrop.style.display = 'block';
                    vContainer.style.display = 'flex';
                    
                    setTimeout(() => {
                        vBackdrop.style.opacity = '1';
                        vContainer.classList.add('show');
                    }, 50);
                });
            }, 400); 
        }

        // Handle Resizing
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
