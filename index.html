<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dough Drop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --shop-pink: #ff6b9e;
            --shop-yellow: #fcd34d;
            --shop-white: #ffffff;
            --shop-cream: #fff9f0;
            --text-dark: #4a2c2a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Comic Sans MS', "Chalkboard SE", "Marker Felt", sans-serif;
            background-color: var(--shop-pink);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.2) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header { 
            padding: 2rem 1rem 1rem; 
            text-align: center; 
            position: relative; 
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .app-icon {
            width: 85px;
            height: 85px;
            border-radius: 22px;
            border: 4px solid var(--text-dark);
            box-shadow: 4px 4px 0 var(--text-dark);
            object-fit: cover;
        }

        h1 { 
            font-size: 2.5rem; margin: 0; color: white; 
            text-shadow: 3px 3px 0px var(--text-dark);
            text-transform: uppercase;
        }

        #builder { 
            width: 95%; max-width: 500px; padding: 1.5rem; 
            background: var(--shop-cream); 
            border-radius: 30px; 
            box-shadow: 0 15px 0px rgba(0,0,0,0.1);
            margin-bottom: 4rem;
            border: 4px solid var(--text-dark);
            transition: opacity 0.4s ease, transform 0.4s ease;
            position: relative;
            z-index: 5;
        }

        .section-label {
            font-size: 1rem; text-transform: uppercase; color: var(--text-dark);
            margin: 1.5rem 0 0.75rem; font-weight: 900;
        }

        .visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .visual-card {
            background: white; border: 3px solid #e2e8f0; border-radius: 20px;
            padding: 15px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .visual-card.active { border-color: var(--shop-pink); background: #fff0f3; transform: scale(1.02); }

        .glaze-row { display: flex; justify-content: space-between; gap: 10px; }
        .glaze-drip-ui { flex: 1; height: 60px; cursor: pointer; border-radius: 10px; border: 3px solid transparent; display: flex; align-items: center; justify-content: center; }
        .glaze-drip-ui.active { border-color: var(--text-dark); transform: scale(1.1); }
        .glaze-drip-ui span { color: white; font-size: 0.85rem; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

        .topping-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .topping-item {
            background: white; border: 3px solid #e2e8f0; border-radius: 15px;
            padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        .topping-item.active { border-color: var(--shop-pink); background: #fff0f3; }

        .slider { width: 100%; height: 12px; margin: 15px 0; cursor: pointer; }

        .btn-primary {
            width: 100%; background: #4ade80; color: var(--text-dark); border: 4px solid var(--text-dark);
            padding: 1.25rem; font-size: 1.3rem; font-weight: 900; border-radius: 20px;
            margin-top: 2rem; cursor: pointer; box-shadow: 0 6px 0 var(--text-dark);
            transition: all 0.1s;
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--text-dark); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        /* CANVAS OVERLAY */
        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10; display: none; opacity: 0; transition: opacity 0.8s ease;
            pointer-events: none;
        }

        /* VERDICT OVERLAY */
        #verdict-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 107, 158, 0.3); backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 15; display: none; opacity: 0; transition: opacity 0.6s ease;
        }

        #verdict-container {
            position: fixed; 
            /* FIX 3: Badge Safe Zone - shifted top down slightly & added max-height */
            top: 53%; 
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5) translateY(100px);
            background: var(--shop-white); border: 6px solid var(--text-dark);
            border-radius: 30px; 
            padding-top: 3.5rem; 
            padding-bottom: 1.5rem; 
            z-index: 20;
            display: none; opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 90%; max-width: 450px; 
            max-height: 82vh; /* Prevents container from pushing badge off the top */
            flex-direction: column; align-items: center;
            box-shadow: 0px 20px 0px rgba(74, 44, 42, 0.15);
        }

        #verdict-container.show {
            opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0);
        }

        /* FIX 1: Inner Scroll Area */
        .verdict-scroll-area {
            width: 100%;
            flex: 1 1 auto; /* Allows container to shrink/grow and scroll within parent */
            min-height: 0;  /* Critical: prevents flex children from blowing out container height */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 1.5rem;
            margin-bottom: 10px; /* Breathing room above the buttons */
        }
        
        /* Custom styled scrollbars for the new scroll area */
        .verdict-scroll-area::-webkit-scrollbar { width: 6px; }
        .verdict-scroll-area::-webkit-scrollbar-track { background: transparent; }
        .verdict-scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .score-badge {
            position: absolute; 
            top: -50px; left: 50%; margin-left: -50px; 
            background: var(--shop-yellow);
            width: 100px; height: 100px; border: 6px solid var(--text-dark);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: 900; transform: rotate(10deg);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
            z-index: 25; 
        }

        #chef-title { margin-top: 0; color: var(--text-dark); text-transform: uppercase; font-size: 1.4rem; }
        
        #verdict-text {
            font-family: serif; font-size: 1.15rem; line-height: 1.5; text-align: center;
            margin-bottom: 1.5rem; color: #333; min-height: 80px;
        }

        /* FIX 2: Responsive Chef Buttons */
        .chef-switcher {
            display: flex; 
            flex-wrap: wrap; /* Allows buttons to stack smoothly */
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 1.5rem; 
            width: 100%;
            flex: 0 0 auto; /* Prevents switcher from squishing inside flex column */
        }

        .chef-btn {
            flex: 1 1 calc(33.333% - 8px); 
            min-width: 80px; /* Stops buttons from shrinking to unreadable sizes */
            padding: 0.6rem; border: 3px solid var(--text-dark); border-radius: 12px;
            font-size: 0.75rem; font-weight: 900; cursor: pointer; background: white; transition: 0.2s;
        }
        .chef-btn.active { background: var(--shop-pink); color: white; transform: scale(1.05); }

        .btn-visualize {
            width: 100%; background: #60a5fa; color: white; border: 3px solid var(--text-dark);
            padding: 0.8rem; border-radius: 15px; font-weight: 900; cursor: pointer;
            margin-bottom: 1rem; box-shadow: 0 4px 0 var(--text-dark); transition: transform 0.1s, box-shadow 0.1s;
            flex: 0 0 auto;
        }
        .btn-visualize:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--text-dark); }
        .btn-visualize:disabled { background: #cbd5e1; cursor: not-allowed; }

        #generated-image-container {
            width: 100%; aspect-ratio: 1; background: #eee; border-radius: 15px; 
            margin-bottom: 1rem; display: none; overflow: hidden; border: 2px solid var(--text-dark);
            flex: 0 0 auto;
        }
        #generated-image-container img { width: 100%; height: 100%; object-fit: cover; }

        .btn-rebake {
            background: var(--shop-yellow); color: var(--text-dark); border: 4px solid var(--text-dark);
            padding: 1rem 2rem; font-size: 1.5rem; font-weight: 900; border-radius: 30px;
            cursor: pointer; box-shadow: 0 6px 0 var(--text-dark);
            transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; letter-spacing: 2px;
            width: 100%;
            flex: 0 0 auto;
        }
        .btn-rebake:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--text-dark); }
        
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <header id="header">
        <img src="dough-drop.png" alt="Dough Drop Icon" class="app-icon">
        <h1>Dough Drop</h1>
    </header>

    <main id="builder">
        <label class="section-label">🍩 BASE</label>
        <div class="visual-grid">
            <div class="visual-card active" onclick="selectType('Glazed', this)"><span>Fluffy</span></div>
            <div class="visual-card" onclick="selectType('Cake', this)"><span>Cake</span></div>
        </div>

        <div id="cake-options" style="display: none;">
            <label class="section-label">🍰 Cake Flavor</label>
            <div class="visual-grid">
                <div class="visual-card active" onclick="selectFlavor('Vanilla', this)"><span>Vanilla</span></div>
                <div class="visual-card" onclick="selectFlavor('Chocolate', this)"><span>Chocolate</span></div>
            </div>
        </div>

        <label class="section-label">🎨 FROSTING</label>
        <div class="glaze-row">
            <div class="glaze-drip-ui" style="background:#4a2c2a;" onclick="selectGlaze('Chocolate', this, '#4a2c2a')">
                <span style="font-size:1.8rem;" title="Chocolate">🍫</span>
            </div>
            <div class="glaze-drip-ui" style="background:#ff6b9e;" onclick="selectGlaze('Strawberry', this, '#ff6b9e')">
                <span style="font-size:1.8rem;" title="Strawberry">🍓</span>
            </div>
            <div class="glaze-drip-ui" style="background:#c68642;" onclick="selectGlaze('Maple', this, '#c68642')">
                <span style="font-size:1.8rem;" title="Maple">🍁</span>
            </div>
            <div class="glaze-drip-ui active" style="background:#fdf5e6;" onclick="selectGlaze('Vanilla', this, '#fdf5e6')">
                <span style="font-size:1.8rem;" title="Vanilla">🍦</span>
            </div>
        </div>

        <label class="section-label">✨ Toppings</label>
        <div class="topping-grid" id="topping-container"></div>

        <label class="section-label">⚖️ Topping Load: <span id="qty-label">400</span></label>
        <input type="range" min="0" max="1000" value="400" class="slider" id="topping-qty" oninput="document.getElementById('qty-label').innerText = this.value">

        <button class="btn-primary" id="btn-submit" onclick="startReview()">Bake & Review!</button>
    </main>

    <div id="canvas-container"></div>
    
    <div id="verdict-backdrop"></div>
    
    <div id="verdict-container">
        <div class="score-badge" id="score-display">?</div>
        
        <!-- Scaffolding wrapper keeps things from overflowing bounds or clipping absolute items -->
        <div class="verdict-scroll-area">
            <h2 id="chef-title">Gordon Ramsay Says:</h2>
            <div id="verdict-text">Consulting the culinary gods...</div>

            <button class="btn-visualize" id="btn-visualize" onclick="generateDonutImage()">📸 TAKE A PICTURE</button>
            <div id="generated-image-container"></div>

            <div class="chef-switcher" id="chef-switcher">
                <button class="chef-btn" id="btn-jacques" onclick="switchChef('Jacques')">JACQUES</button>
                <button class="chef-btn" id="btn-fieri" onclick="switchChef('Fieri')">GUY FIERI</button>
                <button class="chef-btn active" id="btn-gordon" onclick="switchChef('Gordon')">GORDON</button>
            </div>

            <button class="btn-rebake" id="btn-rebake" onclick="location.reload()">REBAKE!</button>
        </div>
    </div>

    <script>
        const apiKey = "";
        let state = { 
            type: "Glazed", 
            flavor: "Vanilla", 
            glaze: "Vanilla", 
            glazeHex: "#fdf5e6", 
            selectedToppings: [],
            currentChef: 'Gordon',
            reviews: {} 
        };

        const chefs = {
            Jacques: {
                title: "Jacques Says:",
                system: "You are Jacques, a world-class, extremely snooty French pastry critic. You are judging a donut. Be witty, slightly mean but fair, and very detailed about the flavor profile. Focus on the lack of 'finesse'. Keep your critique strictly to 2 or 3 short sentences. Return ONLY JSON: {\"critique\": \"string\", \"score\": number}"
            },
            Fieri: {
                title: "Guy Fieri Says:",
                system: "You are Guy Fieri. You are judging a donut for Diners, Drive-Ins and Dives. Use lots of slang like 'Right on', 'Out of bounds', 'Funkalicious', and 'Flavor Town'. You love big flavors and don't care about health. Return ONLY JSON: {\"critique\": \"string\", \"score\": number}"
            },
            Gordon: {
                title: "Gordon Ramsay Says:",
                system: "You are Gordon Ramsay. You are judging a donut. You are incredibly aggressive, loud, and use creative culinary insults. If it's bad, it's 'RAW' or 'A DISASTER'. If it's good, it's 'STUNNING'. Return ONLY JSON: {\"critique\": \"string\", \"score\": number}"
            }
        };

        const toppingsData = [
            { name: "Rainbow Sprinkles", icon: "🌈", colors: [0xFF69B4, 0x00FF00, 0x00BFFF, 0xFFFF00], type: 'cylinder' },
            { name: "Bacon Bits", icon: "🥓", colors: [0x7a2815, 0x5c1a06, 0x8b321b], type: 'box' },
            { name: "Chili Flakes", icon: "🌶️", colors: [0xc22002, 0x941400, 0xed3d18], type: 'flake' },
            { name: "Crushed Takis", icon: "🌪️", colors: [0xff0000, 0xcc0000, 0xaa0000], type: 'dust' },
            { name: "Cap'n Crunch", icon: "🥣", colors: [0xffd700, 0xffe55c, 0xe8ba15], type: 'crunch' },
            { name: "Mini Choc Chips", icon: "🍫", colors: [0x2a140c, 0x1f0e08], type: 'chip' }
        ];

        const tc = document.getElementById('topping-container');
        toppingsData.forEach(t => {
            const item = document.createElement('div');
            item.className = 'topping-item';
            item.innerHTML = `<span style="font-size:1.5rem">${t.icon}</span><span style="font-size:0.85rem">${t.name}</span>`;
            item.onclick = () => {
                item.classList.toggle('active');
                const idx = state.selectedToppings.indexOf(t);
                if(idx > -1) state.selectedToppings.splice(idx, 1);
                else state.selectedToppings.push(t);
            };
            tc.appendChild(item);
        });

        function selectType(t, el) { 
            el.parentElement.querySelectorAll('.visual-card').forEach(c=>c.classList.remove('active'));
            el.classList.add('active'); state.type = t; 
            const cakeOptions = document.getElementById('cake-options');
            if (cakeOptions) {
                if (t === 'Cake') cakeOptions.style.display = 'block';
                else cakeOptions.style.display = 'none';
            }
        }
        function selectFlavor(f, el) { 
            el.parentElement.querySelectorAll('.visual-card').forEach(c=>c.classList.remove('active'));
            el.classList.add('active'); state.flavor = f; 
        }
        function selectGlaze(n, el, h) { 
            document.querySelectorAll('.glaze-drip-ui').forEach(s=>s.classList.remove('active'));
            el.classList.add('active'); state.glaze = n; state.glazeHex = h; 
        }

        async function switchChef(chefKey) {
            state.currentChef = chefKey;
            document.querySelectorAll('.chef-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${chefKey.toLowerCase()}`).classList.add('active');
            document.getElementById('chef-title').innerText = chefs[chefKey].title;
            
            if (state.reviews[chefKey]) {
                displayReview(state.reviews[chefKey]);
            } else {
                document.getElementById('verdict-text').innerText = "Consulting the culinary gods...";
                const review = await getChefReview(chefKey);
                state.reviews[chefKey] = review;
                displayReview(review);
            }
        }

        function displayReview(review) {
            document.getElementById('score-display').innerText = review.score;
            document.getElementById('verdict-text').innerHTML = review.critique;
        }

        async function getChefReview(chefKey) {
            const isEasterEgg = state.type === 'Cake' && state.flavor === 'Vanilla' && state.glaze === 'Strawberry' && state.selectedToppings.length === 1 && state.selectedToppings[0].name === 'Rainbow Sprinkles';
            
            if (isEasterEgg && chefKey === 'Jacques') {
                return {
                    critique: "Mon Dieu... *wipes away a single tear*. I wanted to despise it. It is so pedestrian, so profoundly un-French. But the dense crumb... the unapologetic pink sweetness... the joyful crunch of the rainbow sprinkles... I surrender! It transcends critique! It is an AMERICAN CLASSIC!!",
                    score: 11
                };
            }

            const userQuery = `Critique this pastry: A ${state.type} donut (${state.type === 'Cake' ? state.flavor : 'Yeast'}) with ${state.glaze} glaze and the following toppings: ${state.selectedToppings.map(t => t.name).join(', ') || 'None'}. Return JSON format: {"critique": "your text here", "score": 8.5}`;
            
            try {
                const response = await fetch(`/.netlify/functions/api`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: 'review',
                        query: userQuery,
                        system: chefs[chefKey].system
                    })
                });
                
                if (!response.ok) {
                    const err = await response.text();
                    return { critique: `Proxy Error (${response.status}): ${err}`, score: 0 };
                }
                
                const data = await response.json();
                
                if (data.error) {
                    return { critique: `Google API Error: ${data.error.message || "Unknown"}`, score: 0 };
                }
                
                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/g, '').replace(/```/g, ''); 
                return JSON.parse(rawText);
            } catch (e) {
                return { critique: `Connection Failed: ${e.message}`, score: 0 };
            }
        }

        async function generateDonutImage() {
            const btn = document.getElementById('btn-visualize');
            const imgContainer = document.getElementById('generated-image-container');
            const scrollArea = document.querySelector('.verdict-scroll-area');
            
            btn.disabled = true;
            btn.innerText = "PHOTOGRAPHING...";
            imgContainer.style.display = 'block';
            imgContainer.className = 'loading-shimmer';
            imgContainer.innerHTML = '';
            
            // Scroll down to ensure loading UI is visible
            setTimeout(() => scrollArea.scrollTop = scrollArea.scrollHeight, 50);

            const prompt = `A professional food photography macro shot of a ${state.type} donut (${state.flavor}) with thick ${state.glaze} glaze and ${state.selectedToppings.map(t => t.name).join(', ') || 'no toppings'}. High detail, soft bakery lighting, 8k resolution.`;

            try {
                const encodedPrompt = encodeURIComponent(prompt);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true`;

                const img = new Image();
                img.onload = () => {
                    imgContainer.classList.remove('loading-shimmer');
                    imgContainer.innerHTML = '';
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'cover';
                    imgContainer.appendChild(img);
                    btn.style.display = 'none'; 
                    // Scroll down again once image loads
                    setTimeout(() => scrollArea.scrollTop = scrollArea.scrollHeight, 50);
                };
                img.onerror = () => { throw new Error("Failed to develop the photo."); };
                img.src = imageUrl;

            } catch (e) {
                console.error(e);
                imgContainer.innerHTML = `<div style='padding:20px; text-align:center; color:#dc2626; font-weight:bold; font-size: 0.9rem;'>Camera Error:<br><br>${e.message}</div>`;
                btn.disabled = false;
                btn.innerText = "TRY AGAIN";
            }
        }

        let scene, camera, renderer, donutGroup, frostingGroup, rackGroup, sharedFrostingMat;

        function createRack() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });
            const wireRadius = 0.04;
            for(let i = -8; i <= 8; i++) {
                const geoH = new THREE.CylinderGeometry(wireRadius, wireRadius, 16, 8);
                const wireH = new THREE.Mesh(geoH, mat);
                wireH.rotation.z = Math.PI / 2; wireH.position.z = i * 0.7;
                wireH.castShadow = true; wireH.receiveShadow = true;
                group.add(wireH);
                const geoV = new THREE.CylinderGeometry(wireRadius, wireRadius, 16, 8);
                const wireV = new THREE.Mesh(geoV, mat);
                wireV.rotation.x = Math.PI / 2; wireV.position.x = i * 0.7; wireV.position.y = -wireRadius * 2; 
                wireV.castShadow = true; wireV.receiveShadow = true;
                group.add(wireV);
            }
            group.position.y = -1.45; 
            return group;
        }

        function createGlaze(isCake, donutR, tubeR) {
            const group = new THREE.Group();
            sharedFrostingMat = new THREE.MeshStandardMaterial({ 
                color: state.glazeHex, roughness: 0.1, metalness: 0.0, transparent: true, opacity: 0, side: THREE.DoubleSide
            });
            const points = [];
            const segments = 32;
            const startAngle = isCake ? -Math.PI * 0.4 : -Math.PI * 0.5;
            const endAngle = isCake ? Math.PI * 0.45 : Math.PI * 0.55;
            for (let i = 0; i <= segments; i++) {
                const angle = startAngle + (i / segments) * (endAngle - startAngle); 
                const x = donutR + Math.sin(angle) * tubeR;
                const y = Math.cos(angle) * tubeR;
                points.push(new THREE.Vector2(x, y));
            }
            const topGeo = new THREE.LatheGeometry(points, 64);
            const topMesh = new THREE.Mesh(topGeo, sharedFrostingMat);
            topMesh.castShadow = true; topMesh.receiveShadow = true;
            group.add(topMesh);

            const dripCountOuter = isCake ? 16 : 8;
            const outerAngle = endAngle - 0.05; 
            const oEdgeX = donutR + Math.sin(outerAngle) * tubeR;
            const oEdgeY = Math.cos(outerAngle) * tubeR;
            for(let i = 0; i < dripCountOuter; i++) {
                const angle = (i / dripCountOuter) * Math.PI * 2;
                const dripLen = isCake ? (0.6 + Math.random() * 1.2) : (0.3 + Math.random() * 0.5);
                const dripContainer = new THREE.Group();
                const bodyGeo = new THREE.CylinderGeometry(0.2, 0.1, dripLen, 12);
                bodyGeo.translate(0, -dripLen/2, 0); 
                const body = new THREE.Mesh(bodyGeo, sharedFrostingMat);
                dripContainer.add(body);
                const capGeo = new THREE.SphereGeometry(0.1, 12, 12);
                const cap = new THREE.Mesh(capGeo, sharedFrostingMat);
                cap.position.y = -dripLen; dripContainer.add(cap);
                dripContainer.position.set(Math.cos(angle) * oEdgeX, oEdgeY, Math.sin(angle) * oEdgeX);
                group.add(dripContainer);
            }
            return group;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); 
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            window.addEventListener('resize', () => {
                if(camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.ShadowMaterial({ opacity: 0.15 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2; floor.position.y = -1.8; floor.receiveShadow = true;
            scene.add(floor);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
            keyLight.position.set(5, 15, 8);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 1024;
            keyLight.shadow.mapSize.height = 1024;
            scene.add(keyLight);
            const fillLight = new THREE.PointLight(0xffffff, 0.3);
            fillLight.position.set(-6, 4, -4);
            scene.add(fillLight);
            
            donutGroup = new THREE.Group();
            scene.add(donutGroup);
            rackGroup = createRack();
            scene.add(rackGroup);
            
            const isCake = state.type === 'Cake';
            const donutR = isCake ? 2.4 : 2.9;
            const tubeR = isCake ? 1.35 : 1.15;
            const glazeTubeR = isCake ? 1.42 : 1.20;
            const cakeColor = (isCake && state.flavor === 'Chocolate') ? 0x2a140c : 0xc48035;
            
            const cakeGeo = new THREE.TorusGeometry(donutR, tubeR, 64, 100);
            const cakeMat = new THREE.MeshStandardMaterial({ color: cakeColor, roughness: 1.0 });
            const cake = new THREE.Mesh(cakeGeo, cakeMat);
            cake.rotation.x = Math.PI/2;
            cake.castShadow = true; cake.receiveShadow = true;
            donutGroup.add(cake);
            
            frostingGroup = createGlaze(isCake, donutR, glazeTubeR);
            donutGroup.add(frostingGroup);
            donutGroup.userData = { donutR, tubeR: glazeTubeR };
            donutGroup.position.y = 15;
            camera.position.set(0, 12, 22);
            camera.lookAt(0, -1, 0);
        }

        async function animatePastry() {
            let phase = 'drop';
            const targetQty = parseInt(document.getElementById('topping-qty').value);
            const sprinkles = [];
            
            let currentToppingIndex = 0;
            const numToppingTypes = state.selectedToppings.length;
            const qtyPerTopping = numToppingTypes > 0 ? Math.ceil(targetQty / numToppingTypes) : 0;
            let currentToppingCount = 0;

            return new Promise(resolve => {
                function run() {
                    donutGroup.rotation.y += 0.003;
                    rackGroup.rotation.y += 0.003;
                    
                    if (phase === 'drop') {
                        donutGroup.position.y -= 0.6;
                        if (donutGroup.position.y <= 0) {
                            donutGroup.position.y = 0; 
                            donutGroup.scale.set(1.15, 0.7, 1.15); 
                            phase = 'rebound';
                        }
                    } else if (phase === 'rebound') {
                        donutGroup.scale.x += (1 - donutGroup.scale.x) * 0.15;
                        donutGroup.scale.y += (1 - donutGroup.scale.y) * 0.15;
                        if (Math.abs(1 - donutGroup.scale.y) < 0.01) { 
                            donutGroup.scale.set(1, 1, 1); 
                            phase = 'glaze'; 
                        }
                    } else if (phase === 'glaze') {
                        if (sharedFrostingMat) {
                            sharedFrostingMat.opacity += 0.04;
                            if (sharedFrostingMat.opacity >= 1.0) {
                                sharedFrostingMat.opacity = 1.0;
                                phase = 'toppings';
                            }
                        } else { phase = 'toppings'; }
                    } else if (phase === 'toppings') {
                        if (state.selectedToppings.length === 0 || targetQty === 0) {
                            phase = 'done';
                        } else {
                            // 1. Generate new sprinkles if we haven't reached the target
                            if (sprinkles.length < targetQty && currentToppingIndex < numToppingTypes) {
                                for(let i=0; i<15; i++) {
                                    if(sprinkles.length >= targetQty) break;
                                    const topCfg = state.selectedToppings[currentToppingIndex];
                                    let geo;
                                    if (topCfg.type === 'cylinder') {
                                        geo = new THREE.CylinderGeometry(0.04, 0.04, 0.35, 6);
                                        geo.rotateX(Math.PI / 2);
                                    } else if (topCfg.type === 'flake') {
                                        const s = 0.15 + Math.random()*0.1;
                                        geo = new THREE.BoxGeometry(s, 0.02, s);
                                    } else if (topCfg.type === 'dust') {
                                        const s = 0.06 + Math.random()*0.06;
                                        geo = new THREE.BoxGeometry(s, s, s);
                                    } else if (topCfg.type === 'crunch') {
                                        const s = 0.15 + Math.random() * 0.1;
                                        geo = new THREE.BoxGeometry(s, s, s);
                                    } else if (topCfg.type === 'chip') {
                                        const s = 0.08 + Math.random() * 0.04;
                                        geo = new THREE.TetrahedronGeometry(s);
                                    } else {
                                        geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                                    }
                                    
                                    const mat = new THREE.MeshPhongMaterial({ 
                                        color: topCfg.colors[Math.floor(Math.random() * topCfg.colors.length)],
                                        shininess: 30
                                    });
                                    const mesh = new THREE.Mesh(geo, mat);
                                    
                                    const angle = Math.random() * Math.PI * 2;
                                    const spread = (Math.random() - 0.5) * donutGroup.userData.tubeR;
                                    const radius = donutGroup.userData.donutR + spread;
                                    
                                    mesh.position.x = Math.cos(angle) * radius;
                                    mesh.position.z = Math.sin(angle) * radius;
                                    mesh.position.y = 5 + Math.random() * 5; 
                                    
                                    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                                    
                                    scene.add(mesh);
                                    
                                    // Calculate exact landing height based on the curve of the torus
                                    const surfaceY = Math.sqrt(Math.max(0, donutGroup.userData.tubeR * donutGroup.userData.tubeR - spread * spread));
                                    sprinkles.push({ mesh, targetY: surfaceY + 0.05 });
                                }
                                currentToppingCount += 15;
                                if (currentToppingCount >= qtyPerTopping) {
                                    currentToppingIndex++;
                                    currentToppingCount = 0;
                                }
                            }
                            
                            // 2. Animate ALL existing sprinkles down simultaneously
                            let allSettled = true;
                            for (let i = 0; i < sprinkles.length; i++) {
                                const sp = sprinkles[i];
                                if (sp.mesh.position.y > sp.targetY) {
                                    sp.mesh.position.y -= 0.3; // Speed of the rain
                                    allSettled = false;
                                }
                            }
                            
                            // 3. Move to the next phase only when generation AND falling are both complete
                            const doneGenerating = sprinkles.length >= targetQty || currentToppingIndex >= numToppingTypes;
                            if (doneGenerating && allSettled) {
                                phase = 'done';
                            }
                        }
                    } else if (phase === 'done') {
                        resolve();
                        return;
                    }

                    renderer.render(scene, camera);
                    requestAnimationFrame(run);
                }
                run();
            });
        }

        function startReview() {
            const builder = document.getElementById('builder');
            const canvasContainer = document.getElementById('canvas-container');
            
            builder.style.opacity = '0';
            document.getElementById('header').style.opacity = '0';
            
            setTimeout(() => {
                builder.style.display = 'none';
                canvasContainer.style.display = 'block';
                setTimeout(() => canvasContainer.style.opacity = '1', 50);
                init3D();
                
                // Fixed forever: Route initial load directly through your secure proxy helper
                const initialReviewPromise = getChefReview(state.currentChef);

                animatePastry().then(async () => {
                    const review = await initialReviewPromise;
                    state.reviews[state.currentChef] = review;
                    
                    document.getElementById('score-display').innerText = `${review.score}`;
                    document.getElementById('verdict-text').innerHTML = review.critique;
                    
                    const vBackdrop = document.getElementById('verdict-backdrop');
                    const vContainer = document.getElementById('verdict-container');
                    vBackdrop.style.display = 'block';
                    vContainer.style.display = 'flex';
                    setTimeout(() => {
                        vBackdrop.style.opacity = '1';
                        vContainer.classList.add('show');
                    }, 50);
                });
            }, 400); 
        }
    </script>
